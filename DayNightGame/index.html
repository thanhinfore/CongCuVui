<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foosball JS</title>
    <style>
        body {
            margin: 0;
            background-color: #0d0d0d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
            border: 4px solid #444;
            border-radius: 8px;
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.1);
        }

        canvas {
            display: block;
            background: #1a1a1a;
            image-rendering: pixelated;
        }

        #hud {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        .score-box {
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 40px;
            border-radius: 30px;
            font-size: 2.5rem;
            font-weight: 900;
            display: flex;
            gap: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(4px);
        }

        .blue {
            color: #00E5FF;
            text-shadow: 0 0 15px #00E5FF;
        }

        .red {
            color: #FF2E63;
            text-shadow: 0 0 15px #FF2E63;
        }

        .timer {
            font-size: 1.2rem;
            color: #888;
            margin-top: 5px;
            text-align: center;
            font-family: monospace;
        }

        #message-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 20, 0.95);
            padding: 50px;
            text-align: center;
            border-radius: 15px;
            border: 1px solid #333;
            z-index: 10;
            min-width: 300px;
        }

        #msg-title {
            margin: 0 0 10px;
            font-size: 3rem;
            color: #FFD700;
            letter-spacing: 3px;
        }

        .tutorial {
            font-size: 1rem;
            color: #aaa;
            margin-top: 10px;
            line-height: 1.6;
        }

        button {
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
            margin-top: 25px;
            border-radius: 50px;
            transition: all 0.2s;
            text-transform: uppercase;
        }

            button:hover {
                transform: scale(1.1);
                box-shadow: 0 0 20px white;
            }

        .key {
            display: inline-block;
            background: #333;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #555;
            font-size: 0.8em;
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>
        <div id="hud">
            <div>
                <div class="score-box">
                    <span class="blue" id="scoreBlue">0</span>
                    <span style="color:#777">-</span>
                    <span class="red" id="scoreRed">0</span>
                </div>
                <div class="timer" id="timer">00:00</div>
            </div>
        </div>
        <div id="message-overlay">
            <h1 id="msg-title">FOOSBALL JS</h1>
            <p id="msg-sub" class="tutorial">CHẾ ĐỘ BI LẮC</p>
            <button id="btn-action">VÀO TRẬN</button>
            <div class="tutorial" style="margin-top: 20px; text-align: left;">
                <p><strong>CÁCH CHƠI:</strong></p>
                1. <span class="key">⬆️</span> <span class="key">⬇️</span>: Di chuyển cả đội hình.<br>
                2. <span class="key">⬅️</span> <span class="key">➡️</span>: Xoay người (chỉnh góc).<br>
                3. <span class="key">SPACE</span>: Sút bóng!
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
